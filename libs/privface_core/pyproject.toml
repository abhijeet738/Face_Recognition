[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privface-core"
version = "0.1.0"
description = "PrivFace shared library: key derivation, GRP, IoM hashing, crypto, metrics"
requires-python = ">=3.11"
# Dependencies are added by T05-T08. NumPy must be pinned exactly there (SPEC_AMENDMENTS C6).
# NumPy is pinned exactly (SPEC_AMENDMENTS C6): the same version as research/requirements.txt.
# cryptography is added in T07 and scikit-learn in T08.
dependencies = ["numpy==1.26.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["models: tests that need the ML models (slow, run locally)"]
testpaths = ["tests"]